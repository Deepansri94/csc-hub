name: CSC-HUB CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write      # needed to create GitHub Releases
  pages: write
  id-token: write

concurrency:
  group: "ci-cd"
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────
# JOB 1 — Deploy Admin Web Portal to GitHub Pages
# ─────────────────────────────────────────────────────────────
jobs:
  deploy-web:
    name: Deploy Admin Web to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web App
        env:
          VITE_BASE_URL: "/csc-hub/"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ─────────────────────────────────────────────────────────────
# JOB 2 — Build Electron Desktop App & Publish GitHub Release
# ─────────────────────────────────────────────────────────────
  build-desktop:
    name: Build & Release Electron Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Set Build Version from commit SHA
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_VERSION="1.0.0-build.${SHORT_SHA}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
          # Patch package.json version so Electron embeds it
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '${BUILD_VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Build Vite Frontend
        run: npm run build -- --base /

      - name: Bundle Server with esbuild
        run: node scripts/build_server.mjs

      - name: Package Electron App (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Find built installer
        id: find_exe
        shell: bash
        run: |
          EXE=$(ls release/*.exe | grep -v blockmap | head -1)
          echo "EXE_PATH=${EXE}" >> $GITHUB_ENV
          echo "EXE_NAME=$(basename ${EXE})" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.BUILD_VERSION }}"
          name: "CSC-HUB Desktop v${{ env.BUILD_VERSION }}"
          body: |
            ## CSC-HUB Desktop App — Auto Build

            **Commit**: `${{ github.sha }}`
            **Branch**: `${{ github.ref_name }}`
            **Built at**: ${{ github.event.head_commit.timestamp }}

            ### What's in this release
            ${{ github.event.head_commit.message }}

            ### Install
            Download `CSC-HUB-Setup.exe` below and run it.
            The app will auto-check for newer releases on every startup.
          files: ${{ env.EXE_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
